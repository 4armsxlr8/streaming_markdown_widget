name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the package is developed and formatted with:
          # `dart format --set-exit-if-changed` differs between formatter
          # versions, and a newer stable rewrites analysis_options.yaml.
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter --version
      - name: Publish dry-run (before pub get, which may rewrite tracked lockfiles)
        run: flutter pub publish --dry-run
      - name: Package (pub get / format / analyze / test)
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib example/test
          flutter analyze
          flutter test
      - name: Example (pub get / analyze / test)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
